    function evalCooldown(u) {
      if (!u.lastDonation) return { onCooldown:false, daysLeft:0, elapsed:null, status: u.manualAvailable ? 'AVAILABLE' : 'UNAVAILABLE' };
      const elapsed = Math.max(0, Math.floor((Date.now() - new Date(u.lastDonation).getTime()) / 86400000));
      const onCooldown = elapsed < 90;
      return { onCooldown, daysLeft: onCooldown ? 90 - elapsed : 0, elapsed, status: onCooldown ? 'ON_COOLDOWN' : (u.manualAvailable ? 'AVAILABLE' : 'UNAVAILABLE') };
    }

      const vil = po?.villages.find(x => x.id === vilId);
      return [vil?.[l], po ? `${po[l]} (${po.postCode})` : '', upz?.[l], dist?.[l], div?.[l]].filter(Boolean).join(' → ');
    }

      const pos = selUpz ? selUpz.postOffices : [];
      const selPo = pos.find(p => p.id === locObj.po);
      const vils = selPo ? selPo.villages : [];

        <div class="grid grid-cols-1 sm:grid-cols-2 ${allowAll ? 'lg:grid-cols-5' : 'lg:grid-cols-3'} gap-2.5">
          <select onchange="${onChangeFn}('div',this.value)" class="rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white">

          </select>
          <select onchange="${onChangeFn}('dist',this.value)" ${!dists.length?'disabled':''} class="rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white disabled:bg-slate-100">

            ${dists.map(d => `<option value="${d.id}" ${locObj.dist===d.id?'selected':''}>${d[l]}</option>`).join('')}

                </div>
              ` : ''}
              ${state.authError ? `<p class="text-xs font-bold text-crimson-700">${state.authError}</p>` : ''}
              ${(state.authMode==='register' || showLoginPassword) ? `
                <button type="submit" class="w-full rounded-xl bg-crimson-700 py-2.5 text-sm font-bold text-white hover:bg-crimson-800">${state.authMode==='login'?(state.lang==='bn'?'সাইন ইন করুন':'Sign In'):(state.lang==='bn'?'অ্যাকাউন্ট তৈরি করুন':'Create Account')}</button>
              ` : ''}
            </form>
          </div>
        ` : ''}

        ${state.shareReq ? `
          <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4" onclick="closeShare()">
            <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
              <div class="bg-crimson-700 text-white p-4 flex justify-between items-center">
                <strong class="text-sm">URGENT BLOOD NEEDED (${BLOOD_LABELS[state.shareReq.blood]})</strong>
                <button onclick="closeShare()" class="text-white/80 hover:text-white font-bold">✕</button>
              </div>
              <div class="p-4 space-y-2 text-xs">
                <p class="text-base font-bold">${state.shareReq.patient}</p>
                <p><strong>Hospital:</strong> ${state.shareReq.hospital} (${state.shareReq.ward})</p>
                <p><strong>Contact:</strong> ${state.shareReq.contact} · ${state.shareReq.mobile}</p>
                <a href="https://wa.me/?text=${encodeURIComponent('URGENT BLOOD NEEDED ('+BLOOD_LABELS[state.shareReq.blood]+') at '+state.shareReq.hospital+' Contact: '+state.shareReq.mobile)}" target="_blank" class="block text-center rounded-xl bg-emerald-600 text-white py-2.5 font-bold mt-3">Share on WhatsApp</a>
              </div>
            </div>
          </div>
        ` : ''}

        ${state.showRequestModal ? `
          <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4" onclick="closeReqModal()">
            <form onsubmit="submitReq(event)" class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl" onclick="event.stopPropagation()">
              <h3 class="text-lg font-extrabold">Post Emergency Blood Request</h3>
              <input name="patient" required placeholder="Patient Name" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <div class="grid grid-cols-2 gap-2">
                <select name="blood" class="rounded-xl border border-slate-300 px-3 py-2 text-sm">
                  ${Object.keys(BLOOD_LABELS).map(bg => `<option value="${bg}">${BLOOD_LABELS[bg]}</option>`).join('')}
                </select>
                <input name="units" type="number" min="1" max="10" value="1" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>
              <input name="hospital" required placeholder="Hospital Name" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <input name="ward" required placeholder="Ward / Cabin / Bed No" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <input name="mobile" required placeholder="Primary Mobile (017XXXXXXXX)" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <input name="reason" required placeholder="Medical Reason" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeReqModal()" class="rounded-xl border px-4 py-2 text-xs font-bold">Cancel</button>
                <button type="submit" class="rounded-xl bg-crimson-700 text-white px-4 py-2 text-xs font-bold">Publish (48h Active)</button>
              </div>
            </form>
          </div>
        ` : ''}

        ${state.toast ? `
          <div class="fixed bottom-4 right-4 z-50 rounded-xl bg-slate-900 text-white px-4 py-3 text-xs font-bold shadow-lg">${state.toast}</div>
        ` : ''}
      `;
    }

    window.setTab = (t) => { state.tab = t; render(); };
    window.toggleLang = () => { state.lang = state.lang === 'en' ? 'bn' : 'en'; persist(); render(); };
    window.setSearch = (k, v) => { state.search[k] = v; render(); };
    window.setSearchLoc = (k, v) => {
      const map = { div:'divisionId', dist:'districtId', upz:'upazilaId', po:'postOfficeId', vil:'villageId' };
      state.search[map[k]] = v;
      if (k === 'div') { state.search.districtId=''; state.search.upazilaId=''; state.search.postOfficeId=''; state.search.villageId=''; }
      if (k === 'dist') { state.search.upazilaId=''; state.search.postOfficeId=''; state.search.villageId=''; }
      if (k === 'upz') { state.search.postOfficeId=''; state.search.villageId=''; }
      if (k === 'po') { state.search.villageId=''; }
      render();
    };
    window.setProfileLoc = (k, v) => {
      const cu = state.users.find(u => u.id === state.currentUserId);
      if (!cu) return;
      cu[k] = v;
      if (k === 'div') { cu.dist=''; cu.upz=''; cu.po=''; cu.vil=''; }
      if (k === 'dist') { cu.upz=''; cu.po=''; cu.vil=''; }
      if (k === 'upz') { cu.po=''; cu.vil=''; }
      if (k === 'po') { cu.vil=''; }
      persist(); render();
    };
    window.setAuthLoc = (k, v) => {
      state.authLoc[k] = v;
      if (k === 'div') { state.authLoc.dist=''; state.authLoc.upz=''; state.authLoc.po=''; state.authLoc.vil=''; }
      if (k === 'dist') { state.authLoc.upz=''; state.authLoc.po=''; state.authLoc.vil=''; }
      if (k === 'upz') { state.authLoc.po=''; state.authLoc.vil=''; }
      if (k === 'po') { state.authLoc.vil=''; }
      render();
    };
    window.revealDonor = (id) => { state.confirmedDonors.add(id); render(); };
    window.extendReq = (id) => {
      const r = state.requests.find(x => x.id === id);
      if (r) r.expiresAt = hoursFromNow(48);
      persist(); render();
    };
    window.openShare = (id) => { state.shareReq = state.requests.find(x => x.id === id); render(); };
    window.closeShare = () => { state.shareReq = null; render(); };
    window.openReqModal = () => { state.showRequestModal = true; render(); };
    window.closeReqModal = () => { state.showRequestModal = false; render(); };
    window.openAuthModal = () => { state.showAuthModal = true; state.authError=''; render(); };
    window.closeAuthModal = () => { state.showAuthModal = false; render(); };
    window.setAuthMode = (m) => { state.authMode = m; state.authError=''; render(); };
    window.toggleAuthPass = () => { state.authShowPass = !state.authShowPass; render(); };
    window.onAuthMobileInput = (val) => {
      state.authMobile = val;
      state.authCheckedMobile = null;
      const m = val.trim().replace(/^\+?88/, '');
      if (/^(01[3-9]\d{8})$/.test(m) && state.users.some(u => u.mobile === m)) {
        render();
      }
    };
    window.checkAuthMobile = () => {
      if (!/^(?:\+?88)?01[3-9]\d{8}$/.test(state.authMobile.trim())) {
        state.authError = state.lang==='bn' ? 'সঠিক বাংলাদেশি মোবাইল নম্বর দিন (যেমন 017XXXXXXXX)' : 'Enter a valid BD mobile number (e.g. 017XXXXXXXX)';
        render(); return;
      }
      state.authCheckedMobile = state.authMobile.trim().replace(/^\+?88/, '');
      state.authError = '';
      render();
    };
    window.signOutUser = () => { state.currentUserId = null; persist(); notify('Signed out.'); };
    window.submitPasswordAuth = (e) => {
      e.preventDefault();
      if (!/^(?:\+?88)?01[3-9]\d{8}$/.test(state.authMobile.trim())) {
        state.authError = state.lang==='bn' ? 'সঠিক বাংলাদেশি মোবাইল নম্বর দিন (যেমন 017XXXXXXXX)' : 'Enter a valid BD mobile number (e.g. 017XXXXXXXX)';
        render(); return;
      }
      const m = state.authMobile.trim().replace(/^\+?88/, '');
      const existing = state.users.find(u => u.mobile === m);
      if (state.authMode === 'login') {
        if (!existing) {
          state.authCheckedMobile = m;
          state.authError = '';
          render(); return;
        }
        if (!state.authPassword || state.authPassword.length < 6) {
          state.authError = state.lang==='bn' ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।' : 'Password must be at least 6 characters.';
          render(); return;
        }
        if (state.credentials[m] !== state.authPassword) {
          state.authError = state.lang==='bn' ? 'মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়।' : 'Incorrect mobile number or password.';
          render(); return;
        }
        state.currentUserId = existing.id;
        state.showAuthModal = false; state.authPassword = ''; state.authCheckedMobile = null; state.authError = '';
        state.tab = 'dashboard'; persist();
        notify(state.lang==='bn' ? 'সফলভাবে সাইন ইন হয়েছে!' : 'Signed in successfully!');
        return;
      }

      if (existing) {
        state.authError = state.lang==='bn' ? 'এই নম্বরে ইতিমধ্যে অ্যাকাউন্ট আছে। অনুগ্রহ করে সাইন ইন করুন।' : 'An account with this mobile already exists. Please Sign In.';
        render(); return;
      }
      if (!state.authName.trim()) {
        state.authError = state.lang==='bn' ? 'আপনার পূর্ণ নাম লিখুন।' : 'Please enter your Full Name.';
        render(); return;
      }
      if (!state.authPassword || state.authPassword.length < 6) {
        state.authError = state.lang==='bn' ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।' : 'Password must be at least 6 characters.';
        render(); return;
      }
      if (state.authPassword !== state.authConfirmPassword) {
        state.authError = state.lang==='bn' ? 'পাসওয়ার্ড দুটি মেলেনি।' : 'Passwords do not match.';
        render(); return;
      }
      if (!state.authLoc.div || !state.authLoc.dist || !state.authLoc.upz) {
        state.authError = state.lang==='bn' ? 'অনুগ্রহ করে বিভাগ, জেলা ও উপজেলা/থানা নির্বাচন করুন।' : 'Please select Division, District, and Upazila/Thana.';
        render(); return;
      }
      const created = {
        id:'usr-'+Date.now(), name: state.authName.trim(), mobile:m, whatsapp:m,
        blood: state.authBlood, div: state.authLoc.div,
        dist: state.authLoc.dist, upz: state.authLoc.upz,
        po: state.authLoc.po, vil: state.authLoc.vil,
        manualAvailable:true, hidePhone:false, lastDonation:null, donations:0
      };
      state.credentials[m] = state.authPassword;
      state.users.unshift(created);
      state.currentUserId = created.id;
      state.showAuthModal = false; state.authPassword = ''; state.authConfirmPassword = '';
      state.authLoc = { div:'', dist:'', upz:'', po:'', vil:'' };
      state.authCheckedMobile = null; state.authError = '';
      state.tab = 'dashboard'; persist();
      notify(state.lang==='bn' ? 'অ্যাকাউন্ট তৈরি ও সাইন ইন সম্পন্ন!' : 'Account created and signed in!');
    };
    window.submitReq = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.requests.unshift({
        id:'req-'+Date.now(), requesterId:state.currentUserId || 'usr-guest',
        patient:fd.get('patient'), blood:fd.get('blood'), units:Number(fd.get('units')),
        urgency:'EMERGENCY', hospital:fd.get('hospital'), ward:fd.get('ward'),
        contact:'Attendant', mobile:fd.get('mobile'), reason:fd.get('reason'),
        status:'ACTIVE', expiresAt:hoursFromNow(48)
      });
      state.showRequestModal = false;
      state.tab = 'requests';
      persist();
      notify('Emergency blood request published (48h active).');
    };
    window.toggleAvail = (val) => { const cu = state.users.find(u => u.id === state.currentUserId); if (cu) cu.manualAvailable = val; persist(); notify('Availability updated.'); };
    window.togglePrivacy = (val) => { const cu = state.users.find(u => u.id === state.currentUserId); if (cu) cu.hidePhone = val; persist(); notify('Privacy setting updated.'); };
    window.logTodayDonation = () => { const cu = state.users.find(u => u.id === state.currentUserId); if (cu) { cu.lastDonation = new Date().toISOString(); cu.donations += 1; } persist(); notify('Donation logged & 90-day cooldown started.'); };
    window.saveProfile = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const cu = state.users.find(u => u.id === state.currentUserId);
      if (cu) { cu.name = fd.get('name'); cu.whatsapp = fd.get('whatsapp'); cu.blood = fd.get('blood'); }
      persist();
      notify('Profile & 5-tier location saved!');
    };

    render();
  </script>
</body>
</html>
